# Nginx configuration for the Amytis Docker image.
# Serves the static export (out/) on port 80 inside the container.
# TLS should be terminated outside the container (cloud load balancer / reverse proxy).
# Adapted from nginx.conf.example — SSL directives removed, everything else kept.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- OS-level file serving optimizations ---
    sendfile       on;
    tcp_nopush     on;
    tcp_nodelay    on;

    # --- File descriptor cache ---
    open_file_cache          max=1000 inactive=20s;
    open_file_cache_valid    30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    access_log /var/log/nginx/amytis.access.log combined buffer=16k flush=5s;
    error_log  /var/log/nginx/amytis.error.log warn;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/css
        text/plain
        application/javascript
        text/javascript
        text/xml
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/woff;
        # WOFF2 is already Brotli-compressed internally — gzipping it adds
        # CPU overhead with no size benefit, so it is intentionally excluded.

    # --- Security headers ---
    # NOTE: Nginx add_header in a location block does NOT inherit server-level
    # add_header directives, so they are repeated in every location block.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Cache: Next.js static assets (content-hashed → cache forever) ---
    # `^~` stops nginx from checking the regex locations below.
    location ^~ /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # --- Cache: images and fonts ---
    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        access_log off;
    }

    # --- Cache: Pagefind search index (rebuilt every deploy; short TTL) ---
    location ^~ /pagefind/ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Cache: feed files (short TTL so readers see new posts quickly) ---
    location ~* \.(xml|atom)$ {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- HTML pages + RSC payloads: no cache (always revalidate) ---
    location ~* \.(html|txt)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # --- Feed shortcuts ---
    location ~ ^/feed/?$ { return 301 /feed.xml; }
    location ~ ^/atom/?$ { return 301 /feed.atom; }

    # --- Static file serving ---
    # trailingSlash: true → pages export as slug/index.html; a bare /slug
    # request hits the directory and nginx answers with a 301 to /slug/.
    autoindex off;
    # Relative Location headers, so redirects keep the scheme/host/port the
    # visitor used (important behind port mappings like :37868).
    absolute_redirect off;

    # Custom 404 page (generated by Next.js static export as 404.html).
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    keepalive_timeout 65;
}
